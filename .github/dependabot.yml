version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # Version updates stay off: Dependabot rewrites ranges to bare versions.
  # The entry is what makes Automatic Dependency Submission run for .NET,
  # since a root .slnx is not a manifest it recognises.
  - package-ecosystem: "nuget"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
