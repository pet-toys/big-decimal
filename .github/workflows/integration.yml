name: integration

# Checks the wire formats against the servers that define them before a pull request merges.
# Not in test.yml, which the release calls: a container that fails to pull must not block a
# publish. `test-integration` is a required check, and the name is pinned in the branch ruleset.

on:
  workflow_dispatch:
  push:
    branches:
    - dev
  pull_request:
    branches:
    - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: test-integration
    runs-on: ubuntu-latest

    # One job, not a matrix: only the Ubuntu runner has Docker.
    timeout-minutes: 20

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore big-decimal.integration.slnf

    # No category filter: the solution filter selects the projects, and a filter that matches
    # nothing is a failed run under the Microsoft Testing Platform. One framework: the bytes are
    # the same on all three. With CI set, the fixtures fail rather than skip when no server starts.
    - name: Test
      run: dotnet test big-decimal.integration.slnf --no-restore --configuration Release --framework net10.0

    # NuGet resolves the EF Core range to its floor, so the run above tests EF Core 9 and never
    # 10. This restores its own graph, and a test asserts that what loaded is what was asked for.
    - name: Test against EF Core 10
      run: dotnet test big-decimal.integration.slnf --configuration Release --framework net10.0 -p:EfCoreProviderFloor=10.0.3
