name: build-deploy

on:
  release:
    types:
    - published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  SolutionToPack: "big-decimal.build.slnf"
  ReleaseNotesProject: "src/PetToys.BigDecimal.Core/PetToys.BigDecimal.Core.csproj"
  PackagesSubfolder: "nuget"
  ArtifactName: packages
  GitHubPackageSource: "https://nuget.pkg.github.com/pet-toys/index.json"
  NuGetOrgPackageSource: "https://api.nuget.org/v3/index.json"
  DevRepositoryUrl: "https://github.com/orgs/pet-toys/packages?repo_name=big-decimal"
  ProdRepositoryUrl: "https://www.nuget.org/packages/PetToys.BigDecimal.Core"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  # Runs before anything else so that a bad release fails in seconds rather
  # than after the full test matrix. The release is already published by the
  # time this workflow starts, so neither check can prevent a mistake, only
  # stop it from reaching a feed.
  validate:
    name: validate
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Validate the release tag
      id: version
      env:
        TAG_NAME: ${{ github.event.release.tag_name }}
        IS_PRERELEASE: ${{ github.event.release.prerelease }}
      run: |
        # beta is deliberately absent: prerelease identifiers order as strings,
        # so beta would sort below dev. The ladder that stays ordered is
        # dev, then preview, then rc, then the release itself. The same pattern
        # without the v is in check-release-notes-version.sh, which reads the
        # notes header; a new identifier has to be added in both.
        pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(dev|rc|preview)\.(0|[1-9][0-9]*))?$'
        if [[ ! $TAG_NAME =~ $pattern ]]; then
          echo "::error title=Malformed release tag::'$TAG_NAME' is not a v-prefixed semantic version. Expected v1.2.3, or a prerelease such as v1.2.3-dev.4 (dev, preview, rc)."
          exit 1
        fi

        version="${TAG_NAME#v}"

        # Which feed a package reaches is decided by the release's prerelease
        # checkbox and not by the tag, so the two can disagree silently: a
        # v1.0.0-dev.1 published with the box unticked lands on nuget.org, and a
        # v1.0.0 published with it ticked never leaves GitHub Packages. Neither
        # is reversible once pushed.
        if [[ $version == *-* ]]; then
          tagged_as_prerelease=true
        else
          tagged_as_prerelease=false
        fi

        if [[ $tagged_as_prerelease != "$IS_PRERELEASE" ]]; then
          echo "::error title=Release flag does not match the tag::'$TAG_NAME' carries prerelease=$tagged_as_prerelease, but the GitHub release is marked prerelease=$IS_PRERELEASE. The checkbox picks the feed: ticked publishes to GitHub Packages, unticked publishes to nuget.org. Edit the release to agree with the tag and publish it again."
          exit 1
        fi

        echo "version=$version" >> "$GITHUB_OUTPUT"

    # The notes are the third thing a release cannot take back, after the
    # packages and the release body rendered from them. The export takes the top
    # section whatever its header says, so without this a v1.0.0 release ships
    # the 1.0.0-dev.3 notes and reads as correct everywhere downstream.
    - name: Check the release notes against the version
      run: bash .github/scripts/check-release-notes-version.sh assets/RELEASE-NOTES.txt "${{ steps.version.outputs.version }}"

  test:
    name: test
    needs: validate
    uses: ./.github/workflows/test.yml

  build:
    needs: [validate, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PACKAGE_VERSION: ${{ needs.validate.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore ${{ env.SolutionToPack }}

    - name: Build
      run: dotnet build ${{ env.SolutionToPack }} --configuration Release --no-restore -p:Version=${{ env.PACKAGE_VERSION }}

    # Before the pack, because the packed <releaseNotes> is generated from the
    # same file: PreparePackageReleaseNotesFromFile overwrites the property
    # unconditionally, so an empty file ships as empty notes rather than as an
    # obvious omission, and `gh release edit` below would then wipe the release
    # body with it.
    - name: Export the release notes
      run: |
        notes="${{ runner.temp }}/release-notes.txt"
        dotnet msbuild ${{ env.ReleaseNotesProject }} \
          --target:ExportPackageReleaseNotes -p:ReleaseNotesExportPath="$notes"
        if [[ ! -s $notes ]]; then
          echo "::error title=Empty release notes::assets/RELEASE-NOTES.txt exported nothing for $PACKAGE_VERSION. It is the only source of the packed <releaseNotes> and of the GitHub release body."
          exit 1
        fi

    - name: Pack
      run: dotnet pack ${{ env.SolutionToPack }} --configuration Release  --no-build --include-symbols --output ${{ github.workspace }}/${{ env.PackagesSubfolder }} -p:PackageVersion=${{ env.PACKAGE_VERSION }}

    # The body is composed rather than posted as it stands: it is rendered as
    # Markdown and the notes are plain text, so the fence is what keeps a
    # generic argument from being read as an HTML tag and a parameter named in
    # a sentence from being read as a mention. The pack job checks the same
    # composition before a merge; the read-back below is the only place that
    # sees what the published page actually shows.
    - name: Sync release notes to the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG_NAME: ${{ github.event.release.tag_name }}
      run: |
        body="${{ runner.temp }}/release-body.md"
        bash .github/scripts/compose-release-body.sh "${{ runner.temp }}/release-notes.txt" "$body"
        gh release edit "$TAG_NAME" --notes-file "$body"

        gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG_NAME"           -H "Accept: application/vnd.github.full+json" --jq '.body_html'           > "${{ runner.temp }}/release-body.html"
        python3 .github/scripts/verify-release-body.py           "${{ runner.temp }}/release-notes.txt" "${{ runner.temp }}/release-body.html"

    - name: Upload artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ env.ArtifactName }}
        if-no-files-found: error
        path: |
          ${{ github.workspace }}/${{ env.PackagesSubfolder }}/*.nupkg
          ${{ github.workspace }}/${{ env.PackagesSubfolder }}/*.snupkg
          nuget.config
          global.json

  deploy-github:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: development
      url: ${{ env.DevRepositoryUrl }}
    if: |
      github.event.repository.fork == false &&
      github.event.release.prerelease == true
    permissions:
      packages: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ env.ArtifactName }}

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Push to github
      working-directory: ${{ env.PackagesSubfolder }}
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        dotnet nuget push "*.nupkg" -k "$NUGET_AUTH_TOKEN" -s ${{ env.GitHubPackageSource }} --skip-duplicate

  deploy-nuget:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.ProdRepositoryUrl }}
    if: |
      github.event.repository.fork == false &&
      github.event.release.prerelease == false
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Download artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: ${{ env.ArtifactName }}

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: NuGet login
      id: login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
      with:
        user: ${{ secrets.NUGET_USER }}

    - name: Push to nuget.org
      working-directory: ${{ env.PackagesSubfolder }}
      env:
        NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
      run: |
        dotnet nuget push "*.nupkg" -k "$NUGET_API_KEY" -s ${{ env.NuGetOrgPackageSource }} --skip-duplicate
