name: aot

# Publishes the probe applications trimmed and Native AOT and runs them: a clean analyzer pass
# proves nothing about a marked package on its own. Not in test.yml, which the release calls, and
# not a required check: this leg needs a C++ toolchain and two containers. Two jobs rather than a
# matrix because the Windows runner cannot start the Linux service containers the adapter probes
# need.

on:
  workflow_dispatch:
  push:
    branches:
    - dev
  pull_request:
    branches:
    - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: aot-linux
    runs-on: ubuntu-latest

    timeout-minutes: 30

    # The same images and digests the integration fixtures pin.
    services:
      postgres:
        image: postgres:18-alpine@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2
        env:
          POSTGRES_USER: probe
          POSTGRES_PASSWORD: probe
          POSTGRES_DB: probe
        ports:
        - 5432:5432
        options: >-
          --health-cmd "pg_isready -U probe"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      clickhouse:
        image: clickhouse/clickhouse-server:25.8-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146
        env:
          CLICKHOUSE_USER: probe
          CLICKHOUSE_PASSWORD: probe
          CLICKHOUSE_DB: probe
        ports:
        - 8123:8123
        # 127.0.0.1, not localhost: ClickHouse binds IPv4 only and busybox wget resolves
        # localhost to ::1, so the check fails against a server that is up. Busybox flags only.
        options: >-
          --health-cmd "wget --spider -q http://127.0.0.1:8123/ping || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # 127.0.0.1: a published port is bound on IPv4, and localhost may resolve to ::1 first.
    env:
      BIGDECIMAL_PROBE_POSTGRES: Host=127.0.0.1;Port=5432;Username=probe;Password=probe;Database=probe
      BIGDECIMAL_PROBE_CLICKHOUSE: Host=127.0.0.1;Port=8123;Username=probe;Password=probe;Database=probe

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore big-decimal.aot.slnf

    # Every framework: the framework assemblies the trimmer works on differ between the three.
    - name: Publish trimmed and run
      run: |
        for probe in Core Npgsql ClickHouse; do
          for tfm in net8.0 net9.0 net10.0; do
            out="${{ runner.temp }}/trim-$probe-$tfm"
            dotnet publish "probe/PetToys.BigDecimal.$probe.Probe" \
              --configuration Release --framework "$tfm" --runtime linux-x64 \
              -p:PublishTrimmed=true --output "$out"
            "$out/PetToys.BigDecimal.$probe.Probe"
          done
        done

    # The newest framework alone: the compile costs minutes and nothing here is conditional on
    # the framework. ClickHouse is absent because ClickHouse.Driver 1.4.0 throws on its first
    # query after a Native AOT publish; the package README states the limit.
    - name: Publish Native AOT and run
      run: |
        for probe in Core Npgsql; do
          out="${{ runner.temp }}/aot-$probe"
          dotnet publish "probe/PetToys.BigDecimal.$probe.Probe" \
            --configuration Release --framework net10.0 --runtime linux-x64 \
            -p:PublishAot=true --output "$out"
          "$out/PetToys.BigDecimal.$probe.Probe"
        done

  windows:
    name: aot-windows
    runs-on: windows-latest

    timeout-minutes: 30

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    # vcvarsall.bat calls vswhere by bare name; without this the failure is MSB3073 with an error
    # message glued to the linker path, not "toolchain missing". probe/README.md has the detail.
    - name: Put the Visual Studio Installer on PATH
      shell: bash
      run: echo "C:\Program Files (x86)\Microsoft Visual Studio\Installer" >> "$GITHUB_PATH"

    - name: Restore
      run: dotnet restore big-decimal.aot.slnf

    # The core probe alone: the adapter probes need a server this runner cannot start.
    - name: Publish trimmed and run
      shell: bash
      run: |
        for tfm in net8.0 net9.0 net10.0; do
          out="${{ runner.temp }}/trim-core-$tfm"
          dotnet publish "probe/PetToys.BigDecimal.Core.Probe" \
            --configuration Release --framework "$tfm" --runtime win-x64 \
            -p:PublishTrimmed=true --output "$out"
          "$out/PetToys.BigDecimal.Core.Probe.exe"
        done

    - name: Publish Native AOT and run
      shell: bash
      run: |
        out="${{ runner.temp }}/aot-core"
        dotnet publish "probe/PetToys.BigDecimal.Core.Probe" \
          --configuration Release --framework net10.0 --runtime win-x64 \
          -p:PublishAot=true --output "$out"
        "$out/PetToys.BigDecimal.Core.Probe.exe"
