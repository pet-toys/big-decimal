name: test

# Every job here is a required status check on `dev`, pinned by name in the branch ruleset:
# renaming one blocks every pull request on a check that never reports.

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches:
    - dev
  pull_request:
    branches:
    - dev

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test-${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
        - ubuntu-latest
        - windows-latest
        - macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore big-decimal.tests.slnf

    - name: Test
      run: dotnet test big-decimal.tests.slnf --no-restore --configuration Release --filter Category!=Integration

  # Debug turns on CheckForOverflowUnderflow, which Release does not, so a green
  # Release suite is not a green suite: an arithmetic overflow that the Release
  # build wraps past silently throws here. One leg is enough because the checks
  # the configuration adds are platform independent.
  test-debug:
    name: test-debug
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore big-decimal.tests.slnf

    - name: Test
      run: dotnet test big-decimal.tests.slnf --no-restore --configuration Debug --filter Category!=Integration

  # The release path packs a different solution filter than the one CI tests,
  # and it runs after the GitHub release is already published, where a failure
  # cannot be undone. Packing it here means a break in the packaging targets,
  # the release-notes export or a package's own README surfaces on the pull
  # request that causes it.
  pack:
    name: pack
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    # Mirrors the release gate so the script and the header's shape are
    # exercised on every pull request rather than for the first time at a tag.
    # A pull request packs 0.0.0-ci and has no version to compare against; the
    # release run reaches this through workflow_call with the tag in the ref,
    # and then the two have to agree.
    - name: Check the release notes header
      env:
        TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: bash .github/scripts/check-release-notes-version.sh assets/RELEASE-NOTES.txt "${TAG_NAME#v}"

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: global.json

    - name: Restore
      run: dotnet restore big-decimal.build.slnf

    - name: Pack
      run: dotnet pack big-decimal.build.slnf --configuration Release --no-restore --include-symbols --output "${{ runner.temp }}/nuget" -p:Version=0.0.0-ci -p:PackageVersion=0.0.0-ci

    # The packed <releaseNotes> and the GitHub release body both come from
    # assets/RELEASE-NOTES.txt, and neither can be corrected after a publish, so
    # both are checked on the pull request that changes the text.
    - name: Check the release notes and the body they render into
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        notes="${{ runner.temp }}/release-notes.txt"
        dotnet msbuild src/PetToys.BigDecimal.Core/PetToys.BigDecimal.Core.csproj \
          --target:ExportPackageReleaseNotes -p:ReleaseNotesExportPath="$notes"
        if [[ ! -s $notes ]]; then
          echo "::error title=Empty release notes::assets/RELEASE-NOTES.txt exported nothing. The packed <releaseNotes> and the GitHub release body both come from it, and an empty file ships as empty rather than failing the build."
          exit 1
        fi
        echo "Release notes that would ship ($(wc -c < "$notes") bytes):"
        cat "$notes"

        # The body build-deploy.yml would publish, put through the renderer the
        # release page itself uses - GitHub Flavored Markdown in this
        # repository's context, which is what turns a bare @word into a link to
        # whoever owns that account - and compared with the notes line for line.
        body="${{ runner.temp }}/release-body.md"
        bash .github/scripts/compose-release-body.sh "$notes" "$body"
        gh api --method POST markdown -f mode=gfm -f context="$GITHUB_REPOSITORY"           -F text=@"$body" > "${{ runner.temp }}/release-body.html"
        python3 .github/scripts/verify-release-body.py "$notes" "${{ runner.temp }}/release-body.html"
